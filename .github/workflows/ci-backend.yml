name: CI/CD Plataforma de facturacion

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infraestructura/docker/**'
      - '.dockerignore'
      - '.github/workflows/ci-backend.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infraestructura/docker/**'
      - '.dockerignore'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs:
  test:
    name: Ejecutar pruebas del backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar pruebas Maven
        run: mvn -f backend/pom.xml test

  publish-images:
    name: Construir y publicar imagenes Docker
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6

      - name: Iniciar sesion en GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USERNAME" --password-stdin

      - name: Construir y publicar imagen del backend
        run: |
          IMAGE="ghcr.io/vialto12/plataforma_facturacion_devops-backend"
          SHORT_SHA="${GITHUB_SHA::7}"

          docker build \
            -f infraestructura/docker/backend/Dockerfile \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHORT_SHA" \
            .

          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"

      - name: Construir y publicar imagen del frontend
        run: |
          IMAGE="ghcr.io/vialto12/plataforma_facturacion_devops-frontend"
          SHORT_SHA="${GITHUB_SHA::7}"

          docker build \
            -f infraestructura/docker/frontend/Dockerfile \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHORT_SHA" \
            .

          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
