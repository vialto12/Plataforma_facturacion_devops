services:

  postgres:
    image: postgres:16-alpine
    container_name: plataforma-postgres

    environment:
      POSTGRES_DB: billingapp_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d billingapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - plataforma-network

  backend:
    image: ghcr.io/vialto12/plataforma_facturacion_devops-backend:1.0
    container_name: plataforma-backend

    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
      DB_URL: jdbc:postgresql://postgres:5432/billingapp_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - plataforma-network

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/vialto12/plataforma_facturacion_devops-frontend:1.0
    container_name: plataforma-frontend

    ports:
      - "80:80"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - plataforma-network

volumes:
  postgres_data:
    external: true
    name: compose_postgres_data

networks:
  plataforma-network:
    driver: bridge

